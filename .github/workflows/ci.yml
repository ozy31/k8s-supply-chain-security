name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: shellcheck, go vet, go test
        run: make lint

  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.20.0
      - name: Offline policy tests
        run: make test-policies

  e2e:
    needs: [lint, policy-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v4.1.3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: aquasecurity/setup-trivy@v0.3.1
      - uses: imjasonh/setup-crane@v0.7

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cluster, registry, Kyverno, policies
        run: make up

      - name: Admission tests
        run: make e2e

      - name: Kyverno logs on failure
        if: failure()
        run: kubectl --context kind-supply-chain -n kyverno logs deploy/kyverno-admission-controller --tail=200
