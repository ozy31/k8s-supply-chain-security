apiVersion: v1
kind: Pod
metadata:
  name: hardened
  namespace: demo
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        limits:
          memory: 64Mi
---
