# Offline policy tests: `kyverno test test/policies` (no cluster needed).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-hardening
policies:
  - ../../../policies/common/pod-hardening.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: pod-hardening
    resources: [hardened]
    kind: Pod
    result: pass
  - policy: pod-hardening
    resources:
      - latest-tag
      - runs-as-root
      - privileged
      - keeps-capabilities
      - host-network
      - root-init-container
      - no-memory-limit
    kind: Pod
    result: fail
