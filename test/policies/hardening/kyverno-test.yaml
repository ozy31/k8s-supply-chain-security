# Offline policy tests: `kyverno test test/policies` (no cluster needed).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-hardening
policies:
  - ../../../policies/common/pod-hardening.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: pod-hardening
    resources: [hardened, pinned-by-digest, container-port-and-emptydir, safe-sysctl]
    kind: Pod
    result: pass
  - policy: pod-hardening
    resources:
      - latest-tag
      - untagged-with-port
      - runs-as-root
      - privileged
      - keeps-capabilities
      - host-network
      - root-init-container
      - no-memory-limit
      - no-seccomp
      - unconfined-container
      - host-path
      - host-port
      - unmasked-proc
      - unsafe-sysctl
    kind: Pod
    result: fail
