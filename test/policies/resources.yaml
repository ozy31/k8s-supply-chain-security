apiVersion: v1
kind: Pod
metadata:
  name: hardened
  namespace: demo
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: latest-tag
  namespace: demo
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: kind-registry:5000/app:latest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: runs-as-root
  namespace: demo
spec:
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: demo
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
      securityContext:
        privileged: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: keeps-capabilities
  namespace: demo
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Pod
metadata:
  name: host-network
  namespace: demo
spec:
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: root-init-container
  namespace: demo
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: kind-registry:5000/app:v1.0.0
      securityContext:
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
