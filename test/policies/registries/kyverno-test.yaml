apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: allowed-registries
policies:
  - ../../../policies/common/allowed-registries.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: allowed-registries
    resources: [lab-registry, ghcr-release]
    kind: Pod
    result: pass
  - policy: allowed-registries
    resources: [docker-hub, lookalike-prefix, untrusted-init]
    kind: Pod
    result: fail
