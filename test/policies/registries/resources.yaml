apiVersion: v1
kind: Pod
metadata:
  name: lab-registry
  namespace: demo
spec:
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: ghcr-release
  namespace: demo
spec:
  containers:
    - name: app
      image: ghcr.io/ozy31/k8s-supply-chain-security/app:v1.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: docker-hub
  namespace: demo
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: lookalike-prefix
  namespace: demo
spec:
  containers:
    - name: app
      image: ghcr.io/ozy31/k8s-supply-chain-security-fork/app:v1.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: untrusted-init
  namespace: demo
spec:
  initContainers:
    - name: init
      image: docker.io/library/busybox:1.37
  containers:
    - name: app
      image: kind-registry:5000/app:v1.0.0
